name: Build and publish Python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_BASELINE: eb35a05cc21c69ec1399f7532b7dd61d271ac0d1

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archs: x86_64
            triplet: x64-linux
          - name: macOS arm64
            os: macos-14
            archs: arm64
            triplet: arm64-osx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}

      - name: Clone vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$GITHUB_WORKSPACE/.vcpkg"
          git -C "$GITHUB_WORKSPACE/.vcpkg" checkout --detach "$VCPKG_BASELINE"

      - name: Bootstrap vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true' && runner.os != 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd //c "%GITHUB_WORKSPACE%\\.vcpkg\\bootstrap-vcpkg.bat -disableMetrics"
          else
            "$GITHUB_WORKSPACE/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Configure cibuildwheel environment
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VCPKG_ROOT_PATH="$(cygpath -m "$GITHUB_WORKSPACE")/.vcpkg"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            VCPKG_ROOT_PATH="/project/.vcpkg"
          else
            VCPKG_ROOT_PATH="$GITHUB_WORKSPACE/.vcpkg"
          fi

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            TRIPLETS_PATH="/project/triplets"
            OVERLAY_PORTS="/project/ports"
            CMAKE_ARGS="'-DBLAZERULES_NATIVE_TUNE=OFF'"
          else
            TRIPLETS_PATH="$GITHUB_WORKSPACE/triplets"
            OVERLAY_PORTS=""
            CMAKE_ARGS=""
          fi
          BASE_ENV="VCPKG_ROOT=${VCPKG_ROOT_PATH} VCPKG_DEFAULT_TRIPLET=${{ matrix.triplet }} VCPKG_OVERLAY_TRIPLETS=${TRIPLETS_PATH} SKBUILD_BUILD_VERBOSE=true SKBUILD_LOGGING_LEVEL=INFO"
          if [[ -n "$OVERLAY_PORTS" ]]; then
            BASE_ENV="${BASE_ENV} VCPKG_OVERLAY_PORTS=${OVERLAY_PORTS}"
          fi
          if [[ -n "$CMAKE_ARGS" ]]; then
            BASE_ENV="${BASE_ENV} SKBUILD_CMAKE_ARGS=${CMAKE_ARGS}"
          fi

          {
            echo "CIBW_ARCHS=${{ matrix.archs }}"
            echo "CIBW_BUILD_VERBOSITY=1"
            echo "CIBW_ENVIRONMENT<<EOF"
            echo "$BASE_ENV"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            {
              echo "CIBW_BEFORE_ALL<<EOF"
              echo "dnf install -y zip unzip tar curl perl-IPC-Cmd perl-Text-Template kernel-headers nasm && /project/.vcpkg/bootstrap-vcpkg.sh -disableMetrics && mkdir -p /project/ports && cp -r /project/.vcpkg/ports/openssl /project/ports/ && sed -i '/enable-capieng\\|enable-static-engine\\|enable-ec_nistp_64_gcc_128/d' /project/ports/openssl/portfile.cmake"
              echo "EOF"
              echo "CIBW_AFTER_ALL<<EOF"
              echo "for f in /project/.vcpkg/buildtrees/openssl/config-x64-linux-rel-err.log /project/.vcpkg/buildtrees/openssl/config-x64-linux-rel-out.log; do [ -f \"\$f\" ] && echo \"=== \$f ===\" && tail -100 \"\$f\"; done"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_OUTPUT_DIR: wheelhouse

      - name: Show openssl configure log
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          echo "## openssl configure log" >> "$GITHUB_STEP_SUMMARY"
          for log in \
            "$GITHUB_WORKSPACE/.vcpkg/buildtrees/openssl/config-x64-linux-rel-err.log" \
            "$GITHUB_WORKSPACE/.vcpkg/buildtrees/openssl/config-x64-linux-rel-out.log"; do
            if sudo test -f "$log" 2>/dev/null; then
              echo "### $log" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              sudo tail -100 "$log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Not found: $log" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Summarize wheel failure logs
        if: failure()
        shell: bash
        run: |
          set +e
          echo "## Wheel failure diagnostics" >> "$GITHUB_STEP_SUMMARY"
          mapfile -t logs < <(
            sudo find "$GITHUB_WORKSPACE" -type f -name "*.log" 2>/dev/null | head -n 8
          )
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "No log files found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "### ${log}" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sudo tail -n 80 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload wheel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-failure-${{ matrix.os }}-${{ matrix.archs }}
          path: |
            wheelhouse
            ./**/*.log
            ./**/CMakeCache.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
