name: Build and publish Python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  VCPKG_BASELINE: eb35a05cc21c69ec1399f7532b7dd61d271ac0d1

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archs: x86_64
            triplet: x64-linux
            vcpkg-root: /tmp/vcpkg
          - name: macOS x86_64
            os: macos-13
            archs: x86_64
            triplet: x64-osx
            vcpkg-root: host
          - name: macOS arm64
            os: macos-14
            archs: arm64
            triplet: arm64-osx
            vcpkg-root: host
          - name: Windows x86_64
            os: windows-latest
            archs: AMD64
            triplet: x64-windows-static-md
            vcpkg-root: host

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone vcpkg
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/.vcpkg"
          git init "$GITHUB_WORKSPACE/.vcpkg"
          git -C "$GITHUB_WORKSPACE/.vcpkg" remote add origin https://github.com/microsoft/vcpkg
          git -C "$GITHUB_WORKSPACE/.vcpkg" fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C "$GITHUB_WORKSPACE/.vcpkg" checkout --detach FETCH_HEAD
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd //c "%GITHUB_WORKSPACE%\\.vcpkg\\bootstrap-vcpkg.bat -disableMetrics"
          else
            "$GITHUB_WORKSPACE/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Configure cibuildwheel environment
        shell: bash
        run: |
          if [[ "${{ matrix.vcpkg-root }}" == "host" ]]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              VCPKG_ROOT_PATH="$(cygpath -m "$GITHUB_WORKSPACE")/.vcpkg"
            else
              VCPKG_ROOT_PATH="$GITHUB_WORKSPACE/.vcpkg"
            fi
          else
            VCPKG_ROOT_PATH="${{ matrix.vcpkg-root }}"
          fi

          CMAKE_RELEASE_ARGS="-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT_PATH}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DBLAZERULES_ENABLE_ONNX=ON -DBLAZERULES_IO=ON -DBLAZERULES_IO_KAFKA=ON -DBLAZERULES_IO_AVRO=ON -DBLAZERULES_IO_PROTOBUF=ON -DBLAZERULES_IO_S3=ON -DBLAZERULES_DASHBOARD=ON -DBLAZERULES_AGENT=ON -DBLAZERULES_NATIVE_TUNE=ON -DBLAZERULES_X86_AVX2=ON -DBLAZERULES_X86_AVX512=ON"

          {
            echo "CIBW_ARCHS=${{ matrix.archs }}"
            echo "CIBW_BUILD_VERBOSITY=1"
            echo "CIBW_ENVIRONMENT<<EOF"
            echo "VCPKG_ROOT=${VCPKG_ROOT_PATH} VCPKG_DEFAULT_TRIPLET=${{ matrix.triplet }} CMAKE_ARGS='${CMAKE_RELEASE_ARGS}' SKBUILD_CMAKE_ARGS='${CMAKE_RELEASE_ARGS}' SKBUILD_BUILD_VERBOSE=true SKBUILD_LOGGING_LEVEL=INFO"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            {
              echo "CIBW_BEFORE_ALL<<EOF"
              echo "PYBIN=\\$(command -v python3 || command -v python || ls /opt/python/*/bin/python | head -n 1)"
              echo "\"\\${PYBIN}\" /project/ci/setup_vcpkg.py ${VCPKG_BASELINE} ${VCPKG_ROOT_PATH}"
              echo "${VCPKG_ROOT_PATH}/bootstrap-vcpkg.sh -disableMetrics"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Show wheel build environment
        shell: bash
        run: |
          echo "CIBW_ARCHS=${CIBW_ARCHS}"
          echo "CIBW_ENVIRONMENT=${CIBW_ENVIRONMENT}"
          echo "CIBW_BEFORE_ALL=${CIBW_BEFORE_ALL:-}"
          echo "CIBW_CONFIG_SETTINGS=${CIBW_CONFIG_SETTINGS:-}"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_OUTPUT_DIR: wheelhouse

      - name: Upload wheel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-failure-${{ matrix.os }}-${{ matrix.archs }}
          path: |
            wheelhouse
            ./**/*.log
            ./**/CMakeCache.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
