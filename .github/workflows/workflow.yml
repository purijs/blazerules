name: Build and publish Python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_BASELINE: eb35a05cc21c69ec1399f7532b7dd61d271ac0d1

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archs: x86_64
            triplet: x64-linux
          - name: macOS arm64
            os: macos-14
            archs: arm64
            triplet: arm64-osx
          - name: Windows x86_64
            os: windows-latest
            archs: AMD64
            triplet: x64-windows-static-md

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone vcpkg
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/.vcpkg"
          git init "$GITHUB_WORKSPACE/.vcpkg"
          git -C "$GITHUB_WORKSPACE/.vcpkg" remote add origin https://github.com/microsoft/vcpkg
          git -C "$GITHUB_WORKSPACE/.vcpkg" fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C "$GITHUB_WORKSPACE/.vcpkg" checkout --detach FETCH_HEAD
          if [[ "$RUNNER_OS" != "Linux" ]]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cmd //c "%GITHUB_WORKSPACE%\\.vcpkg\\bootstrap-vcpkg.bat -disableMetrics"
            else
              "$GITHUB_WORKSPACE/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            fi
          fi

      - name: Configure cibuildwheel environment
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VCPKG_ROOT_PATH="$(cygpath -m "$GITHUB_WORKSPACE")/.vcpkg"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            VCPKG_ROOT_PATH="/project/.vcpkg"
          else
            VCPKG_ROOT_PATH="$GITHUB_WORKSPACE/.vcpkg"
          fi

          BASE_ENV="VCPKG_ROOT=${VCPKG_ROOT_PATH} VCPKG_DEFAULT_TRIPLET=${{ matrix.triplet }} SKBUILD_BUILD_VERBOSE=true SKBUILD_LOGGING_LEVEL=INFO"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            BASE_ENV="${BASE_ENV} SKBUILD_CMAKE_ARGS=-DBLAZERULES_NATIVE_TUNE=OFF"
          fi

          {
            echo "CIBW_ARCHS=${{ matrix.archs }}"
            echo "CIBW_BUILD_VERBOSITY=1"
            echo "CIBW_ENVIRONMENT<<EOF"
            echo "$BASE_ENV"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "CIBW_BEFORE_ALL=/project/.vcpkg/bootstrap-vcpkg.sh -disableMetrics" >> "$GITHUB_ENV"
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_OUTPUT_DIR: wheelhouse

      - name: Summarize wheel failure logs
        if: failure()
        shell: bash
        run: |
          set +e
          echo "## Wheel failure diagnostics" >> "$GITHUB_STEP_SUMMARY"
          mapfile -t logs < <(
            find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -type f \
              \( -name "vcpkg-manifest-install.log" \
                 -o -name "CMakeError.log" \
                 -o -name "CMakeOutput.log" \
                 -o -name "CMakeConfigureLog.yaml" \
                 -o -name "*.log" \) 2>/dev/null | head -n 8
          )
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "No CMake/vcpkg log files found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "### ${log}" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload wheel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-failure-${{ matrix.os }}-${{ matrix.archs }}
          path: |
            wheelhouse
            ./**/*.log
            ./**/CMakeCache.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
