{{- if and .Values.agent.enabled (eq .Values.agent.mode "daemonset") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-blazerules-agent
  labels:
    app.kubernetes.io/name: blazerules-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blazerules-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blazerules-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-blazerules
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/blazerules_agent"]
          args: ["--config", "/etc/blazerules/agent.yaml"]
          resources:
{{ toYaml .Values.agent.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/blazerules
              readOnly: true
            - name: varlog
              mountPath: /var/log
            - name: containerlogs
              mountPath: /var/log/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-blazerules-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containerlogs
          hostPath:
            path: /var/log/containers
{{- end }}
